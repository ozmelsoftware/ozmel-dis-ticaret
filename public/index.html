  <script type="module">
    // i18n.js SORGUSUZ import edilir — core/modül dosyaları da './i18n.js' / '../core/i18n.js'
    // ile sorgusuz alıyor. Aynı URL = TEK modül örneği = TEK `lang`. (?v konursa AYRI örnek
    // oluşur; kabuk ile modül farklı dile düşer.) htaccess no-cache zaten tazeler.
    import { t, getLang, setLang, onLangChange } from './js/core/i18n.js';
    import { initGlobalSearch } from './js/core/search.js';
    // Oturum jetonu: giriş ekranı localStorage'a yazar; geliştirmede ?token= ile de gelebilir.
    const params = new URLSearchParams(location.search);
    window.SESSION_TOKEN = params.get('token') || localStorage.getItem('sessionToken') || '';
    if (params.get('token')) localStorage.setItem('sessionToken', params.get('token'));

    function toLogin() {
      localStorage.removeItem('sessionToken');
      localStorage.removeItem('sessionRole');
      localStorage.removeItem('sessionUser');
      location.replace('login.html');
    }

    // Jeton yoksa giriş ekranına gönder — uygulama kabuğu hiç çizilmez.
    if (!window.SESSION_TOKEN) { toLogin(); throw new Error('no-session'); }

    // Kimlik/rol giriş yanıtından (login.php) localStorage'a yazıldı; üst şerit ve
    // modül yetkisi (SESSION_ROLE) buradan türer. Sunucuya ek çağrı yok — böylece
    // .htaccess yönlendirmesi altında API yolu bağımlılığı olmaz.
    window.SESSION_ROLE = localStorage.getItem('sessionRole') || 'editor';
    window.SESSION_USER = localStorage.getItem('sessionUser') || 'Kullanıcı';

    // Modül kaydı: [grupAnahtarı, [[key, dosya, fn], ...]]. Etiketler t('menu.<key>')
    // / t('group.<grup>') ile — dile göre çevrilir.
    const GROUPS = [
      ['general', [['dashboard', 'dashboard.js', 'viewDashboard']]],
      ['supplierQuality', [
        ['sites', 'tedarikciSite.js', 'viewTedarikciSite'],
        ['gunluk-kalite', 'gunlukKalite.js', 'viewGunlukKalite'],
        ['kalite-kontrol', 'kaliteKontrol.js', 'viewKaliteKontrol'],
      ]],
      ['production', [
        ['work-centers', 'workCenters.js', 'viewWorkCenters'],
        ['operations', 'operations.js', 'viewOperations'],
        ['operators', 'operators.js', 'viewOperators'],
        ['routes', 'routes.js', 'viewRoutes'],
        ['capacities', 'capacities.js', 'viewCapacities'],
        ['machine-plans', 'machinePlans.js', 'viewMachinePlans'],
        ['work-orders', 'workOrders.js', 'viewWorkOrders'],
        ['production', 'production.js', 'viewProduction'],
        ['uretim-raporu', 'uretimRaporu.js', 'viewUretimRaporu'],
        ['uretim-panosu', 'uretimPanosu.js', 'viewUretimPanosu'],
        ['verimlilik', 'verimlilik.js', 'viewVerimlilik'],
        ['product-trees', 'productTrees.js', 'viewProductTrees'],
      ]],
      ['purchasingStock', [
        ['purchase-requests', 'purchaseRequests.js', 'viewPurchaseRequests'],
        ['purchase-receipts', 'purchaseReceipts.js', 'viewPurchaseReceipts'],
        ['stok', 'stok.js', 'viewStok'],
      ]],
      ['sales', [
        ['satis-siparisleri', 'satisSiparisleri.js', 'viewSatisSiparisleri'],
        ['orders', 'orders.js', 'viewOrders'],
        ['sales', 'salesReports.js', 'viewSalesReports'],
      ]],
      ['definitions', [
        ['product-codes', 'productCodes.js', 'viewProductCodes'],
        ['terms', 'terms.js', 'viewTerms'],
        ['working-hours', 'workingHours.js', 'viewWorkingHours'],
        ['downtime-reasons', 'downtimeReasons.js', 'viewDowntimeReasons'],
        // Nokta tanımları birer TANIM — Günlük Kalite'yi kullanan kişi nadiren dokunur
        // (müşteri kararı). Modül dosyaları değişmedi, yalnız menü grubu.
        ['first-off-points', 'firstOffPoints.js', 'viewFirstOffPoints'],
        ['hourly-points', 'hourlyPoints.js', 'viewHourlyPoints'],
      ]],
      ['admin', [
        ['tasks', 'tasks.js', 'viewTasks'],
        ['users', 'users.js', 'viewUsers'],
      ]],
    ];

    const BY_KEY = {};
    for (const [group, items] of GROUPS)
      for (const [key, file, fn] of items) BY_KEY[key] = { key, file, fn, group };

    // Hash'i modül anahtarı + parametrelere ayırır: "#work-orders?id=5" -> { key, params:{id} }.
    // Çapraz bağlantılar (sipariş detayından iş emri/ürün) bu ?id desenini kullanır.
    function parseHash() {
      const raw = location.hash.slice(1);
      const qi = raw.indexOf('?');
      const key = (qi < 0 ? raw : raw.slice(0, qi)) || 'work-centers';
      const params = {};
      if (qi >= 0) for (const [k, v] of new URLSearchParams(raw.slice(qi + 1))) params[k] = v;
      return { key, params };
    }

    const nav = document.getElementById('nav');
    const content = document.getElementById('content');
    const crumb = document.getElementById('crumb');

    function renderNav() {
      const cur = parseHash().key;
      nav.innerHTML = '';
      for (const [group, items] of GROUPS) {
        const g = document.createElement('div');
        g.className = 'nav-group';
        g.textContent = t('group.' + group);
        nav.appendChild(g);
        for (const [key] of items) {
          const a = document.createElement('a');
          a.href = '#' + key;
          a.textContent = t('menu.' + key);
          a.dataset.key = key;
          a.setAttribute('aria-current', key === cur ? 'page' : 'false');
          nav.appendChild(a);
        }
      }
    }
    function renderCrumb() {
      const m = BY_KEY[parseHash().key] || BY_KEY['work-centers'];
      crumb.textContent = `${t('group.' + m.group)} / ${t('menu.' + m.key)}`;
    }

    // Üst bar: kullanıcı + rol + ismin baş harfi
    document.getElementById('user-name').textContent = window.SESSION_USER;
    // Avatar baş harfi: kod-noktası güvenli İLK HARF + Türkçe yerel büyütme (ö→Ö, i→İ).
    // Boş/whitespace isimde '?'; asla varsayılan/rakam karakter sızmaz.
    const _name = (window.SESSION_USER || '').trim();
    document.getElementById('avatar').textContent =
      _name ? Array.from(_name)[0].toLocaleUpperCase('tr') : '?';

    // Dil düğmesi: tıklayınca setLang -> 'langchange' olayı. Kabuk (menü/crumb/topbar)
    // aşağıdaki abonelikte yeniden çizilir; İÇERİK modülün kendi aboneliğiyle çizilir.
    const langEl = document.getElementById('lang');
    const logoutBtn = document.getElementById('logout');
    function paintChrome() {
      logoutBtn.textContent = t('action.signout');
      langEl.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.lang === getLang()));
    }
    langEl.addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      setLang(b.dataset.lang);
    });
    onLangChange(() => { renderNav(); renderCrumb(); paintChrome(); });

    // Çıkış: sunucu oturumunu sil (fire-and-forget), yerel oturumu temizle, giriş ekranına dön.
    logoutBtn.addEventListener('click', () => {
      const token = window.SESSION_TOKEN;
      try {
        // Sayfanın kendi konumundan çöz — .htaccess yönlendirmesi altında ../ yanlış çıkardı.
        fetch(new URL('logout.php', location.href).href, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
          keepalive: true
        }).catch(() => {});
      } catch {}
      localStorage.removeItem('sessionToken');
      localStorage.removeItem('sessionRole');
      localStorage.removeItem('sessionUser');
      location.replace('login.html');
    });

    async function route() {
      const { key, params } = parseHash();
      const m = BY_KEY[key] || BY_KEY['work-centers'];
      renderNav();
      renderCrumb();
      content.innerHTML = `<div class="loading">${t('common.loading')}</div>`;
      const showErr = (err) => {
        content.innerHTML = `<div class="state error"><div class="state-title">${t('err.GENERIC')}</div>
          <div class="state-msg">${err && err.message ? err.message : err}</div></div>`;
      };
      try {
        const mod = await import(`./js/modules/${m.file}?v=85`);
        // view fonksiyonu async — hatası sessiz kalmasın, ekranda göster.
        // params (ör. {id}) çapraz bağlantı odağı için modüle geçilir.
        const p = mod[m.fn](content, params);
        if (p && p.catch) p.catch(showErr);
      } catch (err) {
        showErr(err);
      }
    }

    paintChrome();
    initGlobalSearch();   // üst şerit arama düğmesi + Cmd/Ctrl+K + "/" kısayolu
    window.addEventListener('hashchange', route);
    route();
  </script>
